<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17100b">
    <title>Кофейня в пяти эпохах</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #17100b;
        color: #fffaf0;
        font-family: Georgia, "Times New Roman", serif;
      }
      main { width: min(100%, 760px); margin: 0 auto; padding: 24px 16px 56px; }
      header { text-align: center; margin: 10px 0 28px; }
      h1 { font-size: clamp(2rem, 8vw, 4rem); font-weight: 400; line-height: .98; margin: 0; }
      header p { color: #d9bf9b; letter-spacing: .08em; margin: 13px 0 0; text-transform: uppercase; font: 600 .72rem/1.4 system-ui, sans-serif; }
      .screen {
        position: relative;
        width: min(100%, 540px);
        aspect-ratio: 9 / 16;
        overflow: hidden;
        margin: 0 auto;
        border-radius: 3px;
        background: #21140d;
        box-shadow: 0 24px 70px #0009;
      }
      .screen::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(transparent 42%, #000a 100%); }
      .slide { position: absolute; inset: 0; opacity: 0; animation: era 15s ease-in-out infinite both; }
      .slide:nth-of-type(1) { animation-delay: -.6s; }
      .slide:nth-of-type(2) { animation-delay: 2.4s; }
      .slide:nth-of-type(3) { animation-delay: 5.4s; }
      .slide:nth-of-type(4) { animation-delay: 8.4s; }
      .slide:nth-of-type(5) { animation-delay: 11.4s; }
      .slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.15); transform-origin: center top; }
      .caption { position: absolute; z-index: 3; inset: auto 7% 7%; text-shadow: 0 2px 14px #000; }
      .caption strong { display: block; font: 700 clamp(3rem, 15vw, 6rem)/.85 system-ui, sans-serif; letter-spacing: -.07em; }
      .caption span { display: block; margin-top: 11px; font-size: clamp(1rem, 4vw, 1.55rem); letter-spacing: .04em; }
      @keyframes era {
        0% { opacity: 0; transform: scale(1); }
        4% { opacity: 1; }
        18% { opacity: 1; transform: scale(1.09); }
        24% { opacity: 0; transform: scale(1.13); }
        100% { opacity: 0; transform: scale(1.13); }
      }
      .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 34px; }
      figure { margin: 0; background: #25170f; }
      figure:first-child { grid-column: 1 / -1; }
      figure img { display: block; width: 100%; aspect-ratio: 9 / 12; object-fit: cover; }
      figcaption { padding: 11px 12px 13px; color: #f0dcc0; font-size: 1rem; }
      figcaption b { display: block; color: white; font: 700 1.2rem/1 system-ui, sans-serif; margin-bottom: 4px; }
      footer { max-width: 540px; margin: 34px auto 0; text-align: center; color: #d9bf9b; font: .94rem/1.6 system-ui, sans-serif; }
      footer a { color: #fffaf0; text-underline-offset: 3px; }
      @media (min-width: 650px) { .gallery { grid-template-columns: repeat(3, 1fr); } figure:first-child { grid-column: auto; } }
      @media (prefers-reduced-motion: reduce) { .slide { animation: none; } .slide:first-of-type { opacity: 1; } }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Кофейня в пяти эпохах</h1><p>Одна точка на карте · пять взглядов во времени</p></header>
      <section class="screen" aria-label="Анимированная смена пяти эпох кофейни">
        <div class="slide"><img src="images/1200.jpg" alt="Кофейня в 1200 году"><div class="caption"><strong>1200</strong><span>Первый огонь</span></div></div>
        <div class="slide"><img src="images/1800.jpg" alt="Кофейня в 1800 году"><div class="caption"><strong>1800</strong><span>Городской ритуал</span></div></div>
        <div class="slide"><img src="images/1980.jpg" alt="Кофейня в 1980 году"><div class="caption"><strong>1980</strong><span>Неоновый вечер</span></div></div>
        <div class="slide"><img src="images/today.jpg" alt="Кофейня сегодня"><div class="caption"><strong>СЕГОДНЯ</strong><span>Знакомый свет</span></div></div>
        <div class="slide"><img src="images/2100.jpg" alt="Кофейня в 2100 году"><div class="caption"><strong>2100</strong><span>Следующая глава</span></div></div>
      </section>
      <section class="gallery" aria-label="Галерея эпох">
        <figure><img src="images/1200.jpg" alt="Кофейня в 1200 году"><figcaption><b>1200</b>Первый огонь</figcaption></figure>
        <figure><img src="images/1800.jpg" alt="Кофейня в 1800 году"><figcaption><b>1800</b>Городской ритуал</figcaption></figure>
        <figure><img src="images/1980.jpg" alt="Кофейня в 1980 году"><figcaption><b>1980</b>Неоновый вечер</figcaption></figure>
        <figure><img src="images/today.jpg" alt="Кофейня сегодня"><figcaption><b>Сегодня</b>Знакомый свет</figcaption></figure>
        <figure><img src="images/2100.jpg" alt="Кофейня в 2100 году"><figcaption><b>2100</b>Следующая глава</figcaption></figure>
      </section>
      <footer>Страницу собрал ИИ-агент за вечер по правилам <a href="https://github.com/eugeneshilow/spec-driven-company">Spec-Driven Company</a></footer>
    </main>
  </body>
</html>
